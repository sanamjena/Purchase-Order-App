<template>\n    <lightning-card title="Purchase Order Detail" icon-name="custom:custom9">\n        <div class="slds-p-around_medium">\n            <!-- Details of the Purchase Order -->\n            <h2 class="slds-text-heading_medium">Order Details</h2>\n            <template if:true={purchaseOrder}>\n                <p><strong>Order Number:</strong> {purchaseOrder.orderNumber}</p>\n                <p><strong>Order Date:</strong> {purchaseOrder.orderDate}</p>\n                <p><strong>Status:</strong> {purchaseOrder.status}</p>\n                <template if:true={purchaseOrder.items}>\n                    <h3 class="slds-text-heading_small">Items</h3>\n                    <ul>\n                        <template for:each={purchaseOrder.items} for:item="item">\n                            <li key={item.id}>\n                                <strong>{item.name}</strong> - Quantity: {item.quantity} | Price: ${item.price} \n                            </li>\n                        </template>\n                    </ul>\n                </template>\n            </template>\n        </div>\n    </lightning-card>\n</template>
